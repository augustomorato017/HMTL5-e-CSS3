<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalando e usando fontes</title>
    <style>
        @font-face {
            font-family: 'Wanted';
            src: url(fonts/Wanted\ M54.ttf) format(truetype);
        }
        @font-face {
            font-family: 'Girl';
            src: url(fonts/212\ Baby\ Girl.otf) format(opentype);
        }
        
        /* Tipos de format()
        - opentype - otf
        - truetype - ttf
        - embedded-opentype
        - truetype-aat
        - svg */
        h1 {
            font-family: 'Girl';
        }
        
        p {
            font-family: 'Wanted';
            font-size: 32px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Nostrum, ullam. Obcaecati, unde fugit! Officiis assumenda fugit expedita perferendis veniam nobis ut sequi iusto, fugiat tempore quae temporibus dignissimos pariatur in.</p>
</body>
</html>
