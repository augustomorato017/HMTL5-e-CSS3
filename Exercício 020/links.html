<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizando Links</title>
    <style>
        body {
            background-color: black;
        }

        h1 {
            color:white
        }
        .especial {
            background-color: rgb(252, 178, 178);
        }

        .especial::before {
            content: ' → ';
        }

        .especial::after {
            content: ' ← ';
        }
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color: black;
        }

        a:active {
            color: yellow;
        }
    
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/" target="_blank" class="especial">Repositório no GitHub</a></li>
        <li><a href="https://www.cursoemvideo.com/meus-cursos/" target="_blank" class="especial">Curso em Vídeo</a></li>
        <li><a href="https://www.youtube.com/" target="_blank" class="especial">YouTube</a></li>
    </ul>
</body>
</html>
