<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interatividade de Imagens</title>
</head>
<body>
    <h1>Imagem Dinânica</h1>
    <p>Tente abrir esse site em dispositivos diferentes ou simplesmente aumente ou diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Foto Grande">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos reproduzir áudios em HTML5.</p>
    <audio preload="metadata" controls>
        <source src="audio/pgen-tema.mp3" type="audio/mpeg"> <!--Primeira Tentativa, mpeg, wav, ogg-->
        <p>Infelizmente o seu navegador não é compatível.</p>
    </audio>
</body>
</html>
